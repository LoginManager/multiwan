# /etc/multiwan/multiwan.conf — الإعداد الأساسي (يُقرأ من install.sh وكل السكربتات)
MGMT_IF=enp6s18              # كرت الإدارة (net0 / vmbr0)
MGMT_IP=10.10.60.150/24      # عنوان الإدارة
TMP_GW=10.10.60.1            # gateway مؤقت على الإدارة لتثبيت الحزم فقط
LAN_IF=enp6s20               # كرت الخروج للعملاء (net2 — الـVLAN tag على Proxmox)
LAN_IP=192.168.121.1/24      # عنوان الـVM على شبكة العملاء (gateway لهم)
DNS=8.8.8.8
WEB_PORT=8080
ADMIN_USER=admin
ADMIN_PASS=Admon143          # غيّرها
